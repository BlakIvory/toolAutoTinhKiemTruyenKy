emulator:
  type: ldplayer9
  ldplayer_path: D:/LDPlayer/LDPlayer14
  ldconsole_path: D:/LDPlayer/LDPlayer14/ldconsole.exe
  instance_id: 0
  adb_host: 127.0.0.1
  adb_port: 5555
  width: 1600
  height: 900
  dpi: 240
adb:
  adb_path: D:/LDPlayer/LDPlayer14/adb.exe
  connect_timeout: 10
  command_timeout: 30
  screenshot_method: screencap
game:
  package_name: com.titanstudio.tkcm
  activity_name: ''
  startup_wait: 3
vision:
  default_confidence: 0.85
  match_method: TM_CCOEFF_NORMED
timing:
  tap_delay: 0.05
  swipe_duration: 150
  screenshot_interval: 0.2
  action_timeout: 5
  login_timeout: 30
  navigation_timeout: 5
retry:
  max_attempts: 3
  delay_between: 0.5
mode:
  dry_run: false
  mock_adb: false
  debug_screenshots: true
  save_path: logs/debug
  commerce_only: true
logging:
  level: DEBUG
  log_dir: logs
  rotation: 1 day
  retention: 7 days
commerce_optimization:
  abandon_combat_immediately: true   # Hủy ngay lập tức các nhiệm vụ đánh quái để chỉ làm NV đối thoại/shop (tiết kiệm 70% thời gian)
  quest_timeout_minutes: 15          # Hủy bỏ bất kỳ nhiệm vụ nào nếu làm quá 15 phút (tránh kẹt acc)
  use_nearest_commerce_chief: true   # Gặp Chủ thương hội tại thành phố hiện tại để trả/hủy NV thay vì ép về Tuyền Châu
  return_via_xa_phu: true            # Khi ở map dã ngoại, đi Xa Phu về thành phố gần nhất
  fast_dialog_delays: true           # Giảm thiểu các khoảng thời gian chờ (delay) khi đối thoại và kiểm tra nhiệm vụ
