# =====================================================
# AutoQuestTool - App Config
# Game: Tình Kiếm Truyền Kỳ
# =====================================================

# ---------------------------
# Emulator Settings
# ---------------------------
emulator:
  type: "ldplayer9"                              # ldplayer9 | ldplayer
  ldplayer_path: "D:/LDPlayer/LDPlayer9"         # Thu muc cai LDPlayer
  ldconsole_path: "D:/LDPlayer/LDPlayer9/ldconsole.exe"  # Tim thay tu Get-Process
  instance_id: 0                                 # Index cua emulator instance mac dinh
  adb_host: "127.0.0.1"
  adb_port: 5555                                 # Port ADB của LDPlayer – 5555 (emulator-5554)
  width: 1600                                   # detected from: adb shell wm size
  height: 900
  dpi: 240

# ---------------------------
# ADB Settings
# ---------------------------
adb:
  adb_path: "D:/LDPlayer/LDPlayer9/adb.exe"  # Sử dụng adb của LDPlayer để đồng bộ server/client
  connect_timeout: 10 # giây
  command_timeout: 30 # giây
  screenshot_method: "screencap"  # screencap | uiautomator

# ---------------------------
# Game Settings
# ---------------------------
game:
  package_name: "com.titanstudio.tkcm"  # Package name chinh xac (da xac nhan qua adb)
  activity_name: ""   # Main activity - để trống nếu chưa biết
  startup_wait: 15    # giây chờ sau khi start game

# ---------------------------
# Vision Settings
# ---------------------------
vision:
  default_confidence: 0.85
  match_method: "TM_CCOEFF_NORMED"  # OpenCV template matching method

# ---------------------------
# Timing / Timeout
# ---------------------------
timing:
  tap_delay: 0.05       # giây sau mỗi tap (giảm từ 0.1s -> 0.05s)
  swipe_duration: 150   # ms (giảm từ 180ms -> 150ms)
  screenshot_interval: 0.2  # giây giữa các lần chụp (giảm từ 0.3s -> 0.2s)
  action_timeout: 12    # giây timeout cho từng action
  login_timeout: 45     # giây timeout đăng nhập
  navigation_timeout: 15  # giây timeout navigation

# ---------------------------
# Retry Settings
# ---------------------------
retry:
  max_attempts: 3
  delay_between: 0.5   # giây (giảm từ 0.8s -> 0.5s)

# ---------------------------
# Mode
# ---------------------------
mode:
  dry_run: false       # true → block BUY/TRANSFER/LOGOUT
  mock_adb: false      # true → dùng MockADBController (test không cần emulator)
  debug_screenshots: true  # Lưu ảnh debug khi có lỗi
  save_path: "logs/debug"
  commerce_only: true  # Chỉ làm nhiệm vụ Thương hội, bỏ nhiệm vụ thường/chính tuyến

# ---------------------------
# Logging
# ---------------------------
logging:
  level: "DEBUG"       # DEBUG | INFO | WARNING | ERROR
  log_dir: "logs"
  rotation: "1 day"
  retention: "7 days"
